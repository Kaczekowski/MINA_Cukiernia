<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINA Cukiernia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0ec, #fff4d6);
            color: #333;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }

        h1 {
            font-size: 3rem;
            color: #d63384;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #d63384;
            color: white;
            font-weight: bold;
        }

        .tech {
            margin-top: 35px;
        }

        .tech span {
            display: inline-block;
            margin: 6px;
            padding: 8px 14px;
            background: #f3f3f3;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        footer {
            margin-top: 40px;
            color: #777;
            font-size: 0.9rem;
        }

        a {
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>CukierniaClicker</h1>

        <p>
            Prosta webowa gra typu clicker tworzona w Pythonie.
        </p>

        <p>
            Klikaj, zdobywaj punkty i rozwijaj swoją własną cukiernię!
        </p>

        <div class="badge">
            Projekt MINA
        </div>

        <div class="tech">
            <span>Python 3.12</span>
            <span>FastAPI</span>
            <span>Uvicorn</span>
            <span>uv</span>
            <span>pytest</span>
            <span>GitHub Projects</span>
        </div>

        <footer>
            Repozytorium projektu na GitHubie
        </footer>

    </div>

</body>
</html>
