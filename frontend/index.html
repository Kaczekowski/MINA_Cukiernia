<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cukiernia Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container game-container">
        <button class="button" type="button" onclick="openShop()">Sklep</button>
        <h1>Cukiernia 🍰</h1>

        <div class="statsPanel" aria-live="polite">
            <div>
                <span>Pieniądze</span>
                <strong id="moneyValue">0</strong>
            </div>
            <div>
                <span>Kliknięcia</span>
                <strong id="totalClicksValue">0</strong>
            </div>
            <div>
                <span>CPS</span>
                <strong id="cookiesPerSecondValue">0</strong>
            </div>
        </div>

        <button class="cookieButton" id="cookieButton" type="button">
            Piecz ciastko
        </button>

        <p class="statusText" id="statusText" role="status"></p>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
